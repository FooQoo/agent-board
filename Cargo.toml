[package]
name = "agent-board"
version = "0.1.0"
description = "A local, history-backed work board for users and AI agents."
repository = "https://github.com/FooQoo/agent-board"
homepage = "https://github.com/FooQoo/agent-board"
edition = "2024"
autobins = false

[[bin]]
name = "agboard"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eventsource-stream = "0.2"
futures-util = "0.3"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
notify = "8.2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
assert_cmd = "2.2.2"
expectrl = "0.9.0"
predicates = "3.1.4"
tempfile = "3.27.0"
ureq = "3.4.2"
