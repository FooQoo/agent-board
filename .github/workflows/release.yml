name: Release build

# Two separate paths share this file.
#
# 1. CANDIDATE path (every trigger): the `version`, `build` and `candidates`
#    jobs build and check the per-CPU macOS archives with no secrets, no
#    notarization and no write access. Their output is an UNSIGNED CANDIDATE
#    (candidate.json says signed:false) and is never a release asset.
# 2. FORMAL path (only a pushed or re-run `v*` tag, never a pull request): the
#    `sign` jobs run in the protected `release-signing` Environment, the only
#    place the six signing secrets exist. Each CPU signs with Developer ID
#    Application (fixed identifier, Hardened Runtime, secure timestamp) in a
#    temporary keychain, submits a ZIP of the signed binary to notarytool with
#    an App Store Connect API key, and waits for Accepted. No secret value is
#    ever passed on a command line. Every action is pinned to a commit SHA. The very same bytes are then packed into the tar.gz.
#    A single Mach-O cannot be stapled, so there is no stapler step.
#    `release-gate` passes only when BOTH CPUs succeeded, and only then does
#    `release-draft` create a DRAFT Release. A missing certificate, a rejected
#    or timed-out notarization, or one failing CPU stops the run; an unsigned
#    archive is never a fallback for a formal release.
#
# Candidate artifact contract (one artifact per target, same SHA and run):
#   candidate-<target>/agboard-<version>-<target>.tar.gz   unsigned, already stripped
#   candidate-<target>/candidate.json                       {version, target, sha, run_id, signed: false}
# Signed artifact contract (one per target, formal path only):
#   signed-<target>/agboard-<version>-<target>.tar.gz   signed, notarized bytes
#   signed-<target>/signature.json, notary.json          public facts only
#   signed-<target>/notary-log.json                      redacted, failures only

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.96.0"
  NODE_VERSION: "24"
  PNPM_VERSION: "12"
  # The formal minimum is macOS 15 on both CPUs.
  MACOSX_DEPLOYMENT_TARGET: "15.0"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          # A tag push must equal Cargo.toml and Cargo.lock; other runs check
          # that the two files agree with each other.
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tag="${GITHUB_REF_NAME}"; else
            tag="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          fi
          echo "version=$(python3 scripts/release/check-version.py --tag "$tag")" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component rust-docs --target "${{ matrix.target }}"
          rustup default "${RUST_VERSION}"
      - name: Build the web UI first
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - name: Check that the notices are up to date
        run: python3 scripts/release/generate-notices.py --check
      - name: Build the binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Strip before any signing
        run: strip -x "target/${{ matrix.target }}/release/agboard"
      - name: Package
        run: scripts/release/package.sh "${{ matrix.target }}" "target/${{ matrix.target }}/release/agboard" dist
      - name: Verify the archive
        env:
          VERIFY_PORT: "9040"
        run: scripts/release/verify-artifact.sh "dist/agboard-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz" "${{ matrix.target }}"
      - name: Write the candidate record
        run: |
          printf '{"version":"%s","target":"%s","sha":"%s","run_id":"%s","signed":false}\n' \
            "${{ needs.version.outputs.version }}" "${{ matrix.target }}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > dist/candidate.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: candidate-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  candidates:
    # Both CPUs must have produced a candidate of the same version and SHA.
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: candidates
      - name: Check the candidate set
        run: |
          mkdir assets
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cp "candidates/candidate-${target}/agboard-${{ needs.version.outputs.version }}-${target}.tar.gz" assets/
            python3 - "candidates/candidate-${target}/candidate.json" "${target}" "${{ needs.version.outputs.version }}" <<'PY'
          import json, os, sys
          record = json.load(open(sys.argv[1]))
          want = {"target": sys.argv[2], "version": sys.argv[3], "sha": os.environ["GITHUB_SHA"], "signed": False}
          bad = {k: record.get(k) for k, v in want.items() if record.get(k) != v}
          sys.exit(f"candidate record differs: {bad}") if bad else None
          PY
          done
          python3 scripts/release/check-version.py --tag "v${{ needs.version.outputs.version }}" --assets assets

  sign:
    # Formal path only. Never runs for a pull request or a branch run.
    needs: [version, build, candidates]
    if: github.event_name != 'pull_request' && github.ref_type == 'tag'
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: candidate-${{ matrix.target }}
          path: candidate
      - name: Trust only the candidate of this run, SHA and target
        env:
          VERIFY_PORT: "9040"
        run: |
          python3 - "candidate/candidate.json" "${{ matrix.target }}" "${{ needs.version.outputs.version }}" <<'PY'
          import json, os, sys
          record = json.load(open(sys.argv[1]))
          want = {"target": sys.argv[2], "version": sys.argv[3], "sha": os.environ["GITHUB_SHA"],
                  "run_id": os.environ["GITHUB_RUN_ID"], "signed": False}
          bad = {k: record.get(k) for k, v in want.items() if record.get(k) != v}
          sys.exit(f"candidate record differs: {bad}") if bad else None
          PY
          scripts/release/verify-artifact.sh "candidate/agboard-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz" "${{ matrix.target }}"
          mkdir -p work evidence
          tar -xzf "candidate/agboard-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz" -C work agboard
      - name: Create the temporary signing keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/sign-macos.sh prepare
      - name: Sign
        run: scripts/release/sign-macos.sh sign work/agboard
      - name: Verify the signature
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/verify-signature.sh work/agboard "${{ matrix.target }}" --json evidence/signature.json
      - name: Notarize and wait for Accepted
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: scripts/release/notarize-macos.sh work/agboard "${{ matrix.target }}" evidence
      - name: Pack the same bytes and check the archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERIFY_PORT: "9040"
        run: |
          scripts/release/package.sh "${{ matrix.target }}" work/agboard evidence
          archive="evidence/agboard-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          scripts/release/verify-artifact.sh "$archive" "${{ matrix.target }}"
          mkdir unpacked
          tar -xzf "$archive" -C unpacked agboard
          scripts/release/verify-signature.sh unpacked/agboard "${{ matrix.target }}"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: signed-${{ matrix.target }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Failure log
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: signing-failure-${{ matrix.target }}
          path: evidence/notary-log.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Delete the keychain and key material
        if: always()
        run: scripts/release/sign-macos.sh cleanup

  release-gate:
    # Passes only when both CPUs signed and were notarized Accepted.
    needs: [version, sign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: signed-*
          path: signed
      - name: Gate on both CPUs
        run: |
          mkdir evidence
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            if [ -d "signed/signed-${target}" ]; then mv "signed/signed-${target}" "evidence/${target}"; fi
          done
          python3 scripts/release/release-gate.py --evidence evidence \
            --version "${{ needs.version.outputs.version }}" --sha "${GITHUB_SHA}" --out release
      - name: Render the Formula candidate
        run: |
          mkdir -p release/formula
          python3 scripts/release/render-formula.py --tag "v${{ needs.version.outputs.version }}" \
            --sums release/assets/SHA256SUMS --assets release/assets --out release/formula/agboard.rb
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 14

  release-draft:
    # The only job with write access. It creates a DRAFT; publishing is a
    # separate human decision.
    needs: [version, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-assets
          path: release
      - name: Create the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft --verify-tag \
            --title "${GITHUB_REF_NAME}" --notes "Draft: review the notes before publishing." \
            release/assets/*
