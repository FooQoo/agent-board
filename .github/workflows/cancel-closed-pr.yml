name: Cancel CI of a closed pull request

# A pull request that is merged or closed no longer needs its checks. Its CI run would
# otherwise keep the macOS runners busy, and the run for the merge on main would wait for
# them. This job runs on Linux, so it never waits for a macOS runner itself.

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    name: Cancel the pull request's CI runs
    runs-on: ubuntu-latest
    steps:
      - name: Cancel runs still queued or in progress
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          for status in queued in_progress waiting pending; do
            gh run list --workflow CI --event pull_request --branch "$BRANCH" --status "$status" \
              --json databaseId --jq '.[].databaseId'
          done | sort -u | while read -r id; do
            echo "Cancelling run $id"
            gh run cancel "$id" || true
          done
