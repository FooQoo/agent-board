name: Documentation site

# Builds the documentation site and the browser demo, tests the demo, and publishes both to
# GitHub Pages. The demo (web/dist-demo/) is served from demo/ inside the site, at
# the repository-specific Pages path. Run this workflow again after a repository rename.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            docs/pnpm-lock.yaml
            web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - run: pnpm --dir docs install --frozen-lockfile
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir e2e install --frozen-lockfile
      - name: Set the Pages path and snapshot version
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          echo "AGBOARD_DEMO_BASE=/${repo_name}/demo/" >> "$GITHUB_ENV"
          repository_url="https://github.com/$GITHUB_REPOSITORY"
          node -e 'const fs = require("node:fs"); const url = process.argv[1]; fs.writeFileSync("docs/.vitepress/release.json", JSON.stringify({version: "1.1.1", url}) + "\n");' "$repository_url/tree/396b35e1fcf0c87cd89275593f4624e0f4dbe9da"
      - run: pnpm --dir docs build
      - run: pnpm --dir web build:demo
      # VitePress empties its output folder when it builds, so the demo is copied in
      # afterwards. A page or public file named demo would collide with it; stop instead
      # of overwriting either one.
      - name: Add the demo to the site
        run: |
          if [ -e docs/.vitepress/dist/demo ]; then
            echo "docs/.vitepress/dist/demo already exists; the demo would overwrite it." >&2
            exit 1
          fi
          cp -R web/dist-demo docs/.vitepress/dist/demo
          test -f docs/.vitepress/dist/demo/index.html
      # The demo suite opens the site as Pages will serve it, runs the guide to the end, and
      # tries the board. A broken demo fails here, before anything is uploaded.
      - run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: Test the demo
        run: pnpm --dir e2e test:demo
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
