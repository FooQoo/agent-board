name: Documentation site

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/release/docs-release.mjs"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/release/docs-release.mjs"
      - ".github/workflows/docs.yml"
  # The published releases decide the version in the header and the release notes pages.
  # A release published with the workflow token may not start this workflow; then run it
  # by hand (workflow_dispatch) to refresh the site.
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A release event would otherwise build the tag, which may be older than the
          # site that is already published. Build the default branch instead.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
          # Page "last updated" times come from the Git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm --dir docs install --frozen-lockfile
      # Pull requests keep the build offline and show the "not yet published" state.
      # The published site reads the GitHub Releases; if that fails, the build stops
      # and the site that is already published stays as it is.
      - name: Read the published releases
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/docs-release.mjs --github --repo "$GITHUB_REPOSITORY"
      - run: pnpm --dir docs build
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
