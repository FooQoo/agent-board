name: Documentation site

# Builds the documentation site and the browser demo, and publishes both to GitHub Pages.
# The demo (web/dist-demo/) is served from demo/ inside the site, at /agent-board/demo/,
# so a change to the web UI also rebuilds the site.

on:
  pull_request:
    paths:
      - "docs/**"
      - "web/**"
      - "scripts/release/docs-release.mjs"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "web/**"
      - "scripts/release/docs-release.mjs"
      - ".github/workflows/docs.yml"
  # The published releases decide the version in the header.
  # A release published with the workflow token may not start this workflow; then run it
  # by hand (workflow_dispatch) to refresh the site.
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release event would otherwise build the tag, which may be older than the
          # site that is already published. Build the default branch instead.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
          # Page "last updated" times come from the Git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            docs/pnpm-lock.yaml
            web/pnpm-lock.yaml
      - run: pnpm --dir docs install --frozen-lockfile
      - run: pnpm --dir web install --frozen-lockfile
      # Pull requests keep the build offline and show the "not yet published" state.
      # The published site reads the GitHub Releases; if that fails, the build stops
      # and the site that is already published stays as it is.
      - name: Read the published releases
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/docs-release.mjs --github --repo "$GITHUB_REPOSITORY"
      - run: pnpm --dir docs build
      # Writes web/dist-demo/ for the base /agent-board/demo/.
      - run: pnpm --dir web build:demo
      # VitePress empties its output folder when it builds, so the demo is copied in
      # afterwards. A page or public file named demo would collide with it; stop instead
      # of overwriting either one.
      - name: Add the demo to the site
        run: |
          if [ -e docs/.vitepress/dist/demo ]; then
            echo "docs/.vitepress/dist/demo already exists; the demo would overwrite it." >&2
            exit 1
          fi
          cp -R web/dist-demo docs/.vitepress/dist/demo
          test -f docs/.vitepress/dist/demo/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
